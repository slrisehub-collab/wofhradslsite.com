<section class="newsletter-band" id="newsletter" aria-labelledby="nl-heading">
  <div class="newsletter-inner">
    <span class="section-label" style="color:#F9A825;">Newsletter</span>
    <h2 id="nl-heading">Subscribe to our newsletter</h2>
    <p>Get news, stories and ways to support women and girls in Sierra Leone, delivered to your inbox.</p>
    <form class="subscribe-form" data-subscribe novalidate>
      <label class="sr-only" for="nl-email">Email address</label>
      <input type="email" id="nl-email" name="email" placeholder="Your email address" autocomplete="email" required />
      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <button type="submit" class="btn btn-donate">Subscribe</button>
      <p class="subscribe-msg" role="status" aria-live="polite"></p>
    </form>
    <p class="newsletter-fine">We only use your email to send you WOFHRAD-SL news. We'll ask you to confirm first, and you can unsubscribe at any time. <a href="/privacy.html" style="color:inherit;text-decoration:underline;">Privacy policy</a>.</p>
  </div>
</section>
